<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">CSP 1편 cover</title>
  <desc id="cover-desc">어두운 청록색 배경 왼쪽에 제목 'CSP란 무엇인가', 오른쪽에 브라우저 창 안의 Content-Security-Policy 헤더 한 줄과 허용된 app.js, 차단된 evil.js 한 줄씩을 보여 주는 그림</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e" />
      <stop offset="1" stop-color="#0f4c4a" />
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.55" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <rect x="72" y="84" width="140" height="44" rx="22" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.6" />
    <text x="142" y="113" font-size="20" font-weight="600" fill="#99f6e4" text-anchor="middle">보안 · 웹</text>
    <rect x="228" y="84" width="72" height="44" rx="22" fill="#fb923c" />
    <text x="264" y="113" font-size="20" font-weight="700" fill="#1c1917" text-anchor="middle">1편</text>
    <text x="72" y="232" font-size="64" font-weight="800" fill="#f0fdfa">CSP란 무엇인가</text>
    <text x="72" y="304" font-size="40" font-weight="700" fill="#ccfbf1">동작 방식과 지시어</text>
    <rect x="72" y="344" width="96" height="6" rx="3" fill="#fb923c" />
    <text x="72" y="404" font-size="26" font-weight="500" fill="#a7c4c1">default-src · script-src · nonce</text>
    <text x="72" y="566" font-size="22" font-weight="600" fill="#8fb5b2">휘발성 메모리 백업소</text>
    <text x="294" y="566" font-size="22" font-weight="400" fill="#8fb5b2">dev.route50.kr</text>
  </g>

  <g transform="translate(690 130)" filter="url(#shadow)">
    <rect width="440" height="340" rx="20" fill="#0b1220" stroke="#334155" stroke-width="2" />
    <rect width="440" height="52" rx="20" fill="#111a2e" />
    <rect y="32" width="440" height="20" fill="#111a2e" />
    <circle cx="30" cy="26" r="7" fill="#f87171" />
    <circle cx="54" cy="26" r="7" fill="#fbbf24" />
    <circle cx="78" cy="26" r="7" fill="#34d399" />
    <text x="220" y="33" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" fill="#94a3b8" text-anchor="middle">example.com</text>
    <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="20">
      <text x="30" y="100" fill="#5eead4">Content-Security-Policy</text>
      <text x="30" y="136" fill="#f8fafc">script-src 'self'</text>
    </g>
    <rect x="30" y="168" width="380" height="64" rx="12" fill="#14532d" fill-opacity="0.55" stroke="#34d399" stroke-opacity="0.6" />
    <text x="52" y="208" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="20" fill="#bbf7d0">app.js</text>
    <text x="388" y="208" font-size="22" font-weight="700" fill="#86efac" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif">허용</text>
    <rect x="30" y="252" width="380" height="64" rx="12" fill="#7f1d1d" fill-opacity="0.6" stroke="#f87171" stroke-opacity="0.7" />
    <text x="52" y="292" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="20" fill="#fecaca">evil.js</text>
    <text x="388" y="292" font-size="22" font-weight="700" fill="#fca5a5" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', sans-serif">차단</text>
  </g>
</svg>
