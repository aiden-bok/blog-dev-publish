<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">브라우저가 CSP로 스크립트를 판단하는 과정</title>
  <desc id="diagram-desc">서버가 HTML과 Content-Security-Policy 헤더를 함께 보내면, 브라우저가 페이지의 script 두 개를 정책과 비교해 같은 출처의 app.js는 실행하고 공격자가 주입한 evil.example는 차단하는 흐름</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M7 2 L12 7 L7 12" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="butt" />
    </marker>
  </defs>
  <rect width="1200" height="600" rx="24" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="598" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="84" font-size="34" font-weight="800" fill="#0f172a">CSP가 스크립트를 걸러 내는 과정</text>
    <text x="64" y="124" font-size="24" font-weight="500" fill="#64748b">정책은 서버가 정하고, 비교와 차단은 브라우저가 합니다</text>

    <g filter="url(#card-shadow)">
      <rect x="64" y="176" width="360" height="296" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2" />
      <rect x="520" y="176" width="616" height="124" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" />
      <rect x="520" y="348" width="616" height="124" rx="18" fill="#ffffff" stroke="#fecaca" stroke-width="2" />
    </g>

    <circle cx="104" cy="218" r="22" fill="#0f766e" />
    <text x="104" y="227" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="140" y="227" font-size="28" font-weight="700" fill="#134e4a">서버 응답</text>
    <text x="88" y="284" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="22" fill="#0f766e">Content-Security-</text>
    <text x="88" y="316" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="22" fill="#0f766e">Policy:</text>
    <text x="88" y="360" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="22" fill="#0f172a">script-src 'self'</text>
    <text x="88" y="424" font-size="22" font-weight="500" fill="#475569">HTML과 헤더가 함께 도착</text>

    <circle cx="560" cy="226" r="22" fill="#15803d" />
    <text x="560" y="235" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="596" y="235" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="24" fill="#0f172a">/app.js</text>
    <text x="596" y="276" font-size="22" font-weight="500" fill="#475569">같은 출처라서 'self'와 일치</text>
    <text x="1104" y="235" font-size="28" font-weight="800" fill="#15803d" text-anchor="end">실행</text>

    <circle cx="560" cy="398" r="22" fill="#b91c1c" />
    <text x="560" y="407" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="596" y="407" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="24" fill="#0f172a">evil.example/x.js</text>
    <text x="596" y="448" font-size="22" font-weight="500" fill="#475569">주입된 외부 스크립트, 정책에 없음</text>
    <text x="1104" y="407" font-size="28" font-weight="800" fill="#b91c1c" text-anchor="end">차단</text>

    <g stroke="#475569" stroke-width="2.5" stroke-linecap="butt" fill="none" marker-end="url(#arrow)">
      <path d="M428 252 H474 V238 H514" />
      <path d="M428 396 H474 V410 H514" />
    </g>
    <text x="64" y="544" font-size="22" font-weight="500" fill="#475569">비교하는 쪽은 브라우저입니다. 헤더를 보내는 서버가 스크립트를 막는 것은 아닙니다.</text>
  </g>
</svg>
