<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Ollama 서버 구조</title>
  <desc id="diagram-desc">ollama 명령, curl, 내 앱이 모두 localhost 11434 포트의 Ollama 서버로 요청을 보내고, 서버가 디스크에 저장된 모델을 메모리에 올려 응답을 만든다는 구조도</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M7 2 L12 7 L7 12" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="butt" />
    </marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="558" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2" />
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="84" font-size="34" font-weight="800" fill="#0f172a">모든 요청은 Ollama 서버를 거칩니다</text>
    <text x="64" y="124" font-size="24" font-weight="500" fill="#64748b">CLI도 같은 서버에 요청을 보내는 클라이언트입니다</text>

    <g filter="url(#card-shadow)">
      <rect x="64" y="176" width="288" height="72" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="2" />
      <rect x="64" y="276" width="288" height="72" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="2" />
      <rect x="64" y="376" width="288" height="72" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="2" />
      <rect x="448" y="176" width="304" height="272" rx="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" />
      <rect x="848" y="176" width="288" height="124" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" />
      <rect x="848" y="324" width="288" height="124" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" />
    </g>

    <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="24" font-weight="600" fill="#9a3412">
      <text x="88" y="222">ollama run</text>
      <text x="88" y="322">curl</text>
    </g>
    <text x="88" y="422" font-size="24" font-weight="600" fill="#9a3412">내 앱 (HTTP)</text>

    <circle cx="488" cy="220" r="22" fill="#059669" />
    <text x="488" y="229" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="520" y="229" font-size="28" font-weight="700" fill="#064e3b">Ollama 서버</text>
    <text x="480" y="300" font-size="24" fill="#334155">localhost:11434</text>
    <text x="480" y="344" font-size="24" fill="#334155">/api/chat</text>
    <text x="480" y="388" font-size="24" fill="#334155">/api/generate</text>

    <circle cx="888" cy="224" r="22" fill="#4f46e5" />
    <text x="888" y="233" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="920" y="233" font-size="28" font-weight="700" fill="#1e1b4b">디스크</text>
    <text x="872" y="278" font-size="24" fill="#334155">받아 둔 모델 파일</text>

    <circle cx="888" cy="372" r="22" fill="#d97706" />
    <text x="888" y="381" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="920" y="381" font-size="28" font-weight="700" fill="#78350f">메모리</text>
    <text x="872" y="426" font-size="24" fill="#334155">요청 시 로드, 5분 유지</text>

    <g stroke="#475569" stroke-width="2.5" stroke-linecap="butt" fill="none" marker-end="url(#arrow)">
      <line x1="356" y1="212" x2="442" y2="212" />
      <line x1="356" y1="312" x2="442" y2="312" />
      <line x1="356" y1="412" x2="442" y2="412" />
      <line x1="756" y1="238" x2="842" y2="238" />
      <line x1="756" y1="386" x2="842" y2="386" />
    </g>
    <text x="64" y="512" font-size="22" fill="#475569">1 요청 수신, 2 모델 파일 읽기, 3 메모리에 올려 응답 생성</text>
  </g>
</svg>
