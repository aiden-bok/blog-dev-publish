<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Next.js 테스트 도구 1편 cover</title>
  <desc id="cover-desc">남색 배경 왼쪽에 제목 'Next.js 테스트 도구', 오른쪽에 단위, 통합, E2E 세 층으로 쌓인 테스트 피라미드와 체크 표시</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b" />
      <stop offset="1" stop-color="#312e81" />
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.28" />
      <stop offset="1" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b0a24" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <rect x="72" y="84" width="236" height="44" rx="22" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.6" />
    <text x="190" y="113" font-size="20" font-weight="600" fill="#6ee7b7" text-anchor="middle">Next.js · Testing</text>
    <rect x="324" y="84" width="72" height="44" rx="22" fill="#f59e0b" />
    <text x="360" y="113" font-size="20" font-weight="700" fill="#1c1917" text-anchor="middle">1편</text>
    <text x="72" y="232" font-size="64" font-weight="800" fill="#f8fafc">Next.js 테스트</text>
    <text x="72" y="304" font-size="44" font-weight="700" fill="#c7d2fe">종류와 도구 고르기</text>
    <rect x="72" y="344" width="96" height="6" rx="3" fill="#34d399" />
    <text x="72" y="404" font-size="26" font-weight="500" fill="#a5b4fc">Vitest · Jest · Playwright</text>
    <text x="72" y="566" font-size="22" font-weight="600" fill="#818cf8">휘발성 메모리 백업소</text>
    <text x="294" y="566" font-size="22" font-weight="400" fill="#6366f1">dev.route50.kr</text>
  </g>

  <!-- 테스트 피라미드: 아래부터 단위, 통합, E2E -->
  <g filter="url(#shadow)" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" font-weight="700" font-size="26">
    <path d="M840 130 L960 130 L1010 232 L790 232 Z" fill="#f472b6" />
    <path d="M780 248 L1020 248 L1070 350 L730 350 Z" fill="#38bdf8" />
    <path d="M720 366 L1080 366 L1130 468 L670 468 Z" fill="#34d399" />
    <text x="900" y="204" fill="#500724" text-anchor="middle">E2E</text>
    <text x="900" y="322" fill="#082f49" text-anchor="middle">통합</text>
    <text x="900" y="440" fill="#022c22" text-anchor="middle">단위</text>
  </g>
  <g transform="translate(1068 100)">
    <circle r="30" fill="#34d399" />
    <path d="M-13 1 L-4 10 L14 -10" fill="none" stroke="#022c22" stroke-width="6" stroke-linejoin="miter" stroke-linecap="butt" />
  </g>
</svg>
