<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">ChatGPT 제대로 쓰기 1편 cover</title>
  <desc id="cover-desc">짙은 남색 배경 왼쪽에 제목 ChatGPT 제대로 쓰기와 1편 배지, 오른쪽에 질문과 답이 오가는 대화창 그림</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b2b" />
      <stop offset="1" stop-color="#134e4a" />
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.3" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" />
    </pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <rect x="72" y="84" width="196" height="44" rx="22" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.6" />
    <text x="170" y="113" font-size="20" font-weight="600" fill="#5eead4" text-anchor="middle">ChatGPT · 사용법</text>
    <rect x="284" y="84" width="72" height="44" rx="22" fill="#f59e0b" />
    <text x="320" y="113" font-size="20" font-weight="700" fill="#1c1917" text-anchor="middle">1편</text>
    <text x="72" y="232" font-size="64" font-weight="800" fill="#f8fafc">ChatGPT</text>
    <text x="72" y="304" font-size="56" font-weight="800" fill="#f8fafc">제대로 쓰기</text>
    <rect x="72" y="340" width="96" height="6" rx="3" fill="#2dd4bf" />
    <text x="72" y="404" font-size="26" font-weight="500" fill="#a7b9c9">프롬프트 · 지침 · 프로젝트</text>
    <text x="72" y="566" font-size="22" font-weight="600" fill="#7e93a6">휘발성 메모리 백업소</text>
    <text x="294" y="566" font-size="22" font-weight="400" fill="#7e93a6">dev.route50.kr</text>
  </g>
  <g transform="translate(700 120)" filter="url(#shadow)">
    <rect width="440" height="390" rx="24" fill="#0f2233" stroke="#2f4f66" stroke-width="2" />
    <rect x="40" y="40" width="260" height="84" rx="20" fill="#1e3a52" />
    <rect x="64" y="66" width="190" height="12" rx="6" fill="#7dd3fc" />
    <rect x="64" y="90" width="130" height="12" rx="6" fill="#7dd3fc" fill-opacity="0.6" />
    <rect x="140" y="148" width="260" height="130" rx="20" fill="#14b8a6" />
    <rect x="164" y="174" width="210" height="12" rx="6" fill="#042f2e" />
    <rect x="164" y="198" width="170" height="12" rx="6" fill="#042f2e" fill-opacity="0.75" />
    <rect x="164" y="222" width="190" height="12" rx="6" fill="#042f2e" fill-opacity="0.75" />
    <rect x="164" y="246" width="100" height="12" rx="6" fill="#042f2e" fill-opacity="0.55" />
    <rect x="40" y="306" width="360" height="52" rx="26" fill="#0b1b2b" stroke="#2f4f66" stroke-width="2" />
    <rect x="64" y="326" width="150" height="12" rx="6" fill="#5b7488" />
    <circle cx="372" cy="332" r="14" fill="#f59e0b" />
  </g>
