<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 464" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">새 연결을 만드는 순서</title>
  <desc id="diagram-desc">1 새 연결 마법사 열기(Ctrl+Shift+N), 2 드라이버 선택, 3 접속 정보 입력, 4 Test Connection 후 Finish의 네 단계가 세로로 이어진다.</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M7 2 L12 7 L7 12" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="butt" />
    </marker>
  </defs>
  <rect width="1200" height="464" rx="24" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="462" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="84" font-size="34" font-weight="800" fill="#0f172a">새 연결을 만드는 순서</text>
    <text x="64" y="124" font-size="24" font-weight="500" fill="#475569">저장한 연결은 Connections 트리에 나타납니다</text>

    <g filter="url(#card-shadow)">
      <rect x="64" y="168" width="240" height="248" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2" />
      <rect x="352" y="168" width="240" height="248" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2" />
      <rect x="640" y="168" width="240" height="248" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2" />
      <rect x="928" y="168" width="208" height="248" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="2" />
    </g>

    <circle cx="104" cy="212" r="22" fill="#0f766e" />
    <text x="104" y="221" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="88" y="288" font-size="28" font-weight="700" fill="#134e4a">마법사 열기</text>
    <text x="88" y="332" font-size="22" fill="#0f766e">Ctrl+Shift+N</text>
    <text x="88" y="370" font-size="22" fill="#475569">툴바 버튼도 가능</text>

    <circle cx="392" cy="212" r="22" fill="#0f766e" />
    <text x="392" y="221" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="376" y="288" font-size="28" font-weight="700" fill="#134e4a">드라이버 선택</text>
    <text x="376" y="332" font-size="22" fill="#0f766e">Search로 검색</text>
    <text x="376" y="370" font-size="22" fill="#475569">Next</text>

    <circle cx="680" cy="212" r="22" fill="#0f766e" />
    <text x="680" y="221" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="664" y="288" font-size="28" font-weight="700" fill="#134e4a">접속 정보</text>
    <text x="664" y="332" font-size="22" fill="#0f766e">Host · Port</text>
    <text x="664" y="370" font-size="22" fill="#475569">Database · 계정</text>

    <circle cx="968" cy="212" r="22" fill="#d97706" />
    <text x="968" y="221" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    <text x="952" y="288" font-size="28" font-weight="700" fill="#78350f">시험, 저장</text>
    <text x="952" y="332" font-size="22" fill="#b45309">Test Connection</text>
    <text x="952" y="370" font-size="22" fill="#475569">Finish</text>

    <g stroke="#475569" stroke-width="2.5" stroke-linecap="butt" fill="none" marker-end="url(#arrow)">
      <line x1="308" y1="292" x2="346" y2="292" />
      <line x1="596" y1="292" x2="634" y2="292" />
      <line x1="884" y1="292" x2="922" y2="292" />
    </g>
  </g>
</svg>
