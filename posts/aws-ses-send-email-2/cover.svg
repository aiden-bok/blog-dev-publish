<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">AWS SES 메일 발송 2편 cover</title>
  <desc id="cover-desc">짙은 남색 배경 왼쪽에 제목 'AWS SES 메일 발송', 오른쪽에 SMTP와 SDK 두 갈래 길이 하나의 봉투로 모이는 그림</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b" />
      <stop offset="1" stop-color="#312e81" />
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 L0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
    </pattern>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbeb" />
      <stop offset="1" stop-color="#fde68a" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <rect x="72" y="84" width="196" height="44" rx="22" fill="#f59e0b" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.7" />
    <text x="170" y="113" font-size="20" font-weight="600" fill="#fcd34d" text-anchor="middle">AWS · Email</text>
    <rect x="284" y="84" width="72" height="44" rx="22" fill="#fbbf24" />
    <text x="320" y="113" font-size="20" font-weight="700" fill="#1c1917" text-anchor="middle">2편</text>

    <text x="72" y="238" font-size="88" font-weight="800" fill="#f8fafc">AWS SES</text>
    <text x="72" y="312" font-size="48" font-weight="700" fill="#e0e7ff">SMTP와 SDK로 발송</text>
    <rect x="72" y="352" width="96" height="6" rx="3" fill="#fbbf24" />
    <text x="72" y="410" font-size="26" font-weight="500" fill="#c7d2fe">Nodemailer · SendEmailCommand</text>

    <text x="72" y="566" font-size="22" font-weight="600" fill="#a5b4fc">휘발성 메모리 백업소</text>
    <text x="294" y="566" font-size="22" font-weight="400" fill="#818cf8">dev.route50.kr</text>
  </g>

  <!-- 두 갈래 길이 봉투로 모이는 그림 -->
  <g transform="translate(700 120)">
    <g fill="none" stroke="#fbbf24" stroke-width="4" stroke-opacity="0.7" stroke-linecap="butt" stroke-linejoin="miter" stroke-dasharray="2.5 10">
      <path d="M130 70 L270 70 L270 200" />
      <path d="M130 330 L270 330 L270 200" />
    </g>
    <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="26" font-weight="700" filter="url(#shadow)">
      <rect x="0" y="30" width="140" height="80" rx="16" fill="#e0e7ff" stroke="#818cf8" stroke-width="3" />
      <text x="70" y="82" fill="#312e81" text-anchor="middle">SMTP</text>
      <rect x="0" y="290" width="140" height="80" rx="16" fill="#e0e7ff" stroke="#818cf8" stroke-width="3" />
      <text x="70" y="342" fill="#312e81" text-anchor="middle">SDK</text>
    </g>
    <g transform="translate(250 140)" filter="url(#shadow)">
      <rect width="190" height="130" rx="14" fill="url(#env)" />
      <path d="M0 14 Q0 0 14 0 L176 0 Q190 0 190 14 L95 76 Z" fill="#fbbf24" />
      <circle cx="95" cy="70" r="16" fill="#4f46e5" />
      <path d="M87 70 L93 76 L104 64" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="miter" stroke-linecap="butt" />
    </g>
  </g>
</svg>
