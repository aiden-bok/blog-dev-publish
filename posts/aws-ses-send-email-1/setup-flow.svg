<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">SES 발송 준비 순서</title>
  <desc id="diagram-desc">도메인 자격 증명 생성, DKIM CNAME 3개 등록, MAIL FROM의 MX와 TXT 등록, 샌드박스 해제 요청의 네 단계를 위에서 아래로 나열한 도표</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M7 2 L12 7 L7 12" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="butt" />
    </marker>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="758" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="84" font-size="34" font-weight="800" fill="#0f172a">SES 발송 준비 순서</text>
    <text x="64" y="124" font-size="24" font-weight="500" fill="#64748b">DNS 레코드는 최대 72시간 안에 반영됩니다</text>

    <g filter="url(#card-shadow)">
      <rect x="64" y="160" width="1072" height="112" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" />
      <rect x="64" y="304" width="1072" height="112" rx="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" />
      <rect x="64" y="448" width="1072" height="112" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="2" />
      <rect x="64" y="592" width="1072" height="112" rx="18" fill="#ffffff" stroke="#fbcfe8" stroke-width="2" />
    </g>

    <circle cx="120" cy="216" r="26" fill="#4f46e5" />
    <text x="120" y="226" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="172" y="208" font-size="30" font-weight="700" fill="#1e1b4b">도메인 자격 증명 생성</text>
    <text x="172" y="248" font-size="24" fill="#475569">리전마다 따로 만들고, www 없이 example.com 입력</text>

    <circle cx="120" cy="360" r="26" fill="#059669" />
    <text x="120" y="370" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="172" y="352" font-size="30" font-weight="700" fill="#064e3b">DKIM 등록</text>
    <text x="172" y="392" font-size="24" fill="#475569">CNAME 3개: 토큰._domainkey.example.com</text>

    <circle cx="120" cy="504" r="26" fill="#d97706" />
    <text x="120" y="514" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="172" y="496" font-size="30" font-weight="700" fill="#78350f">MAIL FROM(SPF) 설정</text>
    <text x="172" y="536" font-size="24" fill="#475569">하위 도메인에 MX 1개와 TXT 1개</text>

    <circle cx="120" cy="648" r="26" fill="#db2777" />
    <text x="120" y="658" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    <text x="172" y="640" font-size="30" font-weight="700" fill="#831843">샌드박스 해제 요청</text>
    <text x="172" y="680" font-size="24" fill="#475569">메일 유형과 웹사이트 입력, 첫 응답은 96시간 이내</text>

    <g stroke="#475569" stroke-width="2.5" stroke-linecap="butt" fill="none" marker-end="url(#arrow)">
      <line x1="600" y1="276" x2="600" y2="300" />
      <line x1="600" y1="420" x2="600" y2="444" />
      <line x1="600" y1="564" x2="600" y2="588" />
    </g>
  </g>
</svg>
