<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">n8n 1편 cover</title>
  <desc id="cover-desc">보라색 배경 위쪽 가운데에 제목 'n8n 워크플로 자동화', 아래쪽에 트리거 노드에서 작업 노드 두 개로 이어지는 그림</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065" />
      <stop offset="1" stop-color="#7c2d5f" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.8">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.35" />
      <stop offset="1" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e0a3c" flood-opacity="0.55" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" text-anchor="middle">
    <rect x="456" y="64" width="288" height="44" rx="22" fill="#fb7185" fill-opacity="0.18" stroke="#fda4af" stroke-opacity="0.7" />
    <text x="600" y="93" font-size="22" font-weight="600" fill="#fecdd3">1편 · 개요와 설치</text>
    <text x="600" y="196" font-size="76" font-weight="800" fill="#fff7f9">n8n 워크플로 자동화</text>
    <text x="600" y="256" font-size="34" font-weight="600" fill="#e9d5ff">클라우드와 설치 버전의 차이</text>
  </g>

  <!-- 워크플로 그림: 트리거 → 작업 노드 2개 -->
  <g filter="url(#shadow)">
    <rect x="152" y="336" width="288" height="112" rx="22" fill="#fff7f9" />
    <rect x="456" y="336" width="288" height="112" rx="22" fill="#ffffff" opacity="0" />
    <rect x="760" y="304" width="288" height="96" rx="22" fill="#fff7f9" />
    <rect x="760" y="416" width="288" height="96" rx="22" fill="#fff7f9" />
  </g>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <circle cx="204" cy="392" r="28" fill="#e11d48" />
    <path d="M196 380 L216 392 L196 404 Z" fill="#ffffff" />
    <text x="248" y="386" font-size="28" font-weight="800" fill="#4c0519">Trigger</text>
    <text x="248" y="422" font-size="22" font-weight="500" fill="#9f1239">매일 09:00</text>
    <circle cx="808" cy="352" r="22" fill="#7c3aed" />
    <text x="808" y="360" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="848" y="362" font-size="26" font-weight="700" fill="#2e1065">HTTP Request</text>
    <circle cx="808" cy="464" r="22" fill="#7c3aed" />
    <text x="808" y="472" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="848" y="474" font-size="26" font-weight="700" fill="#2e1065">메신저 전송</text>
    <text x="64" y="590" font-size="22" font-weight="600" fill="#fda4af">휘발성 메모리 백업소</text>
    <text x="286" y="590" font-size="22" font-weight="400" fill="#c4b5fd">dev.route50.kr</text>
  </g>
  <!-- 연결선 -->
  <g fill="none" stroke="#fda4af" stroke-width="3" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M440 392 H600 V352 H754" />
    <path d="M600 392 V464 H754" />
  </g>
</svg>
