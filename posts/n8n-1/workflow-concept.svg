<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">n8n 워크플로의 기본 구조</title>
  <desc id="diagram-desc">Schedule Trigger가 정해진 시간에 워크플로를 시작하면 HTTP Request 노드가 데이터를 가져오고, 메신저 전송 노드가 결과를 보내는 세 단계 구조</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M7 2 L12 7 L7 12" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="butt" />
    </marker>
  </defs>
  <rect width="1200" height="460" rx="24" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="458" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2" />
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="84" font-size="34" font-weight="800" fill="#0f172a">n8n 워크플로의 기본 구조</text>
    <text x="64" y="124" font-size="24" font-weight="500" fill="#64748b">트리거가 시작하고, 노드가 작업 하나씩 처리해 다음으로 넘깁니다</text>

    <g filter="url(#card-shadow)">
      <rect x="64" y="176" width="312" height="200" rx="18" fill="#ffffff" stroke="#fecdd3" stroke-width="2" />
      <rect x="444" y="176" width="312" height="200" rx="18" fill="#ffffff" stroke="#ddd6fe" stroke-width="2" />
      <rect x="824" y="176" width="312" height="200" rx="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" />
    </g>

    <circle cx="108" cy="220" r="22" fill="#e11d48" />
    <text x="108" y="229" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="144" y="229" font-size="22" font-weight="700" fill="#9f1239">트리거</text>
    <text x="96" y="296" font-size="28" font-weight="700" fill="#4c0519">Schedule Trigger</text>
    <text x="96" y="338" font-size="24" fill="#9f1239">매일 09:00에 시작</text>

    <circle cx="488" cy="220" r="22" fill="#7c3aed" />
    <text x="488" y="229" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="524" y="229" font-size="22" font-weight="700" fill="#5b21b6">노드</text>
    <text x="476" y="296" font-size="28" font-weight="700" fill="#2e1065">HTTP Request</text>
    <text x="476" y="338" font-size="24" fill="#5b21b6">API에서 데이터 조회</text>

    <circle cx="868" cy="220" r="22" fill="#059669" />
    <text x="868" y="229" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="904" y="229" font-size="22" font-weight="700" fill="#047857">노드</text>
    <text x="856" y="296" font-size="28" font-weight="700" fill="#064e3b">메신저 전송</text>
    <text x="856" y="338" font-size="24" fill="#047857">조회 결과를 알림으로</text>

    <g stroke="#475569" stroke-width="2.5" stroke-linecap="butt" fill="none" marker-end="url(#arrow)">
      <line x1="380" y1="276" x2="438" y2="276" />
      <line x1="760" y1="276" x2="818" y2="276" />
    </g>
    <text x="64" y="428" font-size="22" fill="#475569">각 노드의 출력이 다음 노드의 입력이 됩니다</text>
  </g>
</svg>
